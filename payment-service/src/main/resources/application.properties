spring.application.name=payment-service
server.port=8080

# BASE DE DATOS - usa variables de entorno de Docker o localhost por defecto
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# HIBERNATE / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# SI USAS UTF8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# URL HACIA DJANGO
django.service.url=http://localhost:8000/api

# JWT CONFIGURATION
jwt.secret=${JWT_SECRET:mi-clave-secreta-jwt-muy-segura-para-ecommerce}