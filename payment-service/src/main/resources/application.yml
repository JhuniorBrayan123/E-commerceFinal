server:
  port: 8080

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: mi-clave-secreta-jwt-muy-segura-para-ecommerce
  expiration: 3600000


### ✨ ESTA ES LA CLAVE
catalog:
  base-url: http://catalog-service:8000


django:
  service:
    url: http://django-app:8000/api


notification:
  base-url: http://localhost:8000
  retry-attempts: 3
  retry-backoff-ms: 500

logging:
  level:
    com.example.payment_service: DEBUG
