<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Auth Service</title>
</head>

<body>
    <h1>Test Auth Service Connection</h1>
    <button onclick="testRegister()">Test Register</button>
    <button onclick="testLogin()">Test Login</button>
    <div id="result" style="margin-top: 20px; padding: 10px; background: #f0f0f0;"></div>

    <script>
        async function testRegister() {
            const result = document.getElementById('result');
            result.innerHTML = 'Testing register...';

            try {
                const response = await fetch('http://localhost:8081/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'testuser@test.com',
                        password: 'test123',
                        first_name: 'Test',
                        last_name: 'User'
                    })
                });

                const data = await response.json();
                result.innerHTML = `<h3>Response Status: ${response.status}</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                result.innerHTML = `<h3 style="color: red;">Error:</h3><pre>${error.message}</pre>`;
                console.error('Full error:', error);
            }
        }

        async function testLogin() {
            const result = document.getElementById('result');
            result.innerHTML = 'Testing login...';

            try {
                const response = await fetch('http://localhost:8081/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'testuser@test.com',
                        password: 'test123'
                    })
                });

                const data = await response.json();
                result.innerHTML = `<h3>Response Status: ${response.status}</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                result.innerHTML = `<h3 style="color: red;">Error:</h3><pre>${error.message}</pre>`;
                console.error('Full error:', error);
            }
        }
    </script>
</body>

</html>
